<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英语复习</title>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=1" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=1" />
    <script>
      (() => {
        let saved
        try { saved = localStorage.getItem('study-theme') } catch {}
        document.documentElement.dataset.theme = ['light', 'dark'].includes(saved)
          ? saved
          : window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
