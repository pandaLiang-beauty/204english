<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="description" content="204 英语：阅读真题、积累句子、持续复习。" />
    <title>204 英语 · 个人学习空间</title>
    <script>
      (() => {
        let theme = 'system'
        try { theme = localStorage.getItem('study-theme') || 'system' } catch {}
        const dark = theme === 'dark' || (!['light', 'dark'].includes(theme) && window.matchMedia?.('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171c19' : '#f5f6f3'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
